apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermess.fullname" . }}-hermes-headless
  labels:
    {{- include "hermess.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "hermess.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hermes
  ports:
    - name: api
      port: 8642
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermess.fullname" . }}-hermes
  labels:
    {{- include "hermess.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "hermess.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hermes
  ports:
    - name: api
      port: 8642
      targetPort: api
    - name: dashboard
      port: 9119
      targetPort: dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermess.fullname" . }}-knowledge
  labels:
    {{- include "hermess.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "hermess.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hermes
  ports:
    - name: http
      port: 8000
      targetPort: knowledge
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermess.fullname" . }}-extractor
  labels:
    {{- include "hermess.labels" . | nindent 4 }}
    app.kubernetes.io/component: extractor
spec:
  selector:
    {{- include "hermess.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: extractor
  ports:
    - name: http
      port: 8010
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermess.fullname" . }}-frontend
  labels:
    {{- include "hermess.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "hermess.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermess.fullname" . }}-caddy
  labels:
    {{- include "hermess.labels" . | nindent 4 }}
  {{- with .Values.caddy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.caddy.service.type }}
  {{- with .Values.caddy.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  selector:
    {{- include "hermess.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
