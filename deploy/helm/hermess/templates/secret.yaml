{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermess.secretName" . }}
  labels:
    {{- include "hermess.labels" . | nindent 4 }}
type: Opaque
stringData:
  HERMES_API_KEY: {{ required "secrets.values.hermesApiKey is required" .Values.secrets.values.hermesApiKey | quote }}
  KNOWLEDGE_API_KEY: {{ required "secrets.values.knowledgeApiKey is required" .Values.secrets.values.knowledgeApiKey | quote }}
  CADDY_BASIC_AUTH_USER: {{ required "secrets.values.caddyBasicAuthUser is required" .Values.secrets.values.caddyBasicAuthUser | quote }}
  CADDY_BASIC_AUTH_HASH: {{ required "secrets.values.caddyBasicAuthHash is required" .Values.secrets.values.caddyBasicAuthHash | quote }}
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: {{ required "secrets.values.dashboardUsername is required" .Values.secrets.values.dashboardUsername | quote }}
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: {{ required "secrets.values.dashboardPassword is required" .Values.secrets.values.dashboardPassword | quote }}
  HERMES_DASHBOARD_BASIC_AUTH_SECRET: {{ required "secrets.values.dashboardSessionSecret is required" .Values.secrets.values.dashboardSessionSecret | quote }}
  {{- with .Values.secrets.values.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- if .Values.frontend.solari.enabled }}
  OPENAI_REALTIME_API_KEY: {{ required "secrets.values.solariRealtimeApiKey is required when frontend.solari.enabled=true" .Values.secrets.values.solariRealtimeApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.values.localLlmApiKey }}
  LOCAL_LLM_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
