_config_version: 33

model:
  provider: anthropic
  default: claude-sonnet-4-6

fallback_providers:
  - provider: openai-codex
    model: gpt-5.6-sol
  - provider: openrouter
    model: anthropic/claude-sonnet-4.6

agent:
  max_turns: 200
  api_max_retries: 1

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

memory:
  memory_enabled: true
  user_profile_enabled: true

platforms:
  api_server:
    enabled: false # named-profile listener guard
    extra:
      direct_model_requests: true
      model_routes:
        coding:
          provider: openai-codex
          model: gpt-5.6-sol
        anthropic:
          provider: anthropic
          model: claude-sonnet-4-6
