_config_version: 33

model:
  provider: openrouter
  default: anthropic/claude-sonnet-4.6

fallback_providers:
  - provider: anthropic
    model: claude-sonnet-4-6
  - provider: custom
    model: local-model
    base_url: http://vllm:8000/v1
    key_env: LOCAL_LLM_API_KEY

provider_routing:
  require_parameters: true
  data_collection: deny

agent:
  max_turns: 200
  api_max_retries: 1

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

memory:
  memory_enabled: true
  user_profile_enabled: true

platforms:
  api_server:
    enabled: false # named-profile listener guard
    extra:
      direct_model_requests: true
      model_routes:
        coding:
          provider: openai-codex
          model: gpt-5.6-sol
        balanced:
          provider: openrouter
          model: anthropic/claude-sonnet-4.6
