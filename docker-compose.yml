name: hermess

services:
  hermes-init:
    image: ${ALPINE_IMAGE:-alpine:3.22}
    restart: "no"
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    environment:
      HERMES_DEFAULT_PROFILE: ${HERMES_DEFAULT_PROFILE:-codex}
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      OBSIDIAN_VAULT_NAME: ${OBSIDIAN_VAULT_NAME:-HERMESS}
      # Multiplex auth resolves this key from each named profile's own .env.
      API_SERVER_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
    volumes:
      - ${HERMES_DATA_DIR:-./data/hermes}:/opt/data
      - ./config/hermes:/bootstrap:ro
      - ./deploy/scripts/bootstrap-hermes.sh:/usr/local/bin/bootstrap-hermes:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/bootstrap-hermes"]

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e}
    restart: unless-stopped
    command: ["gateway", "run"]
    depends_on:
      hermes-init:
        condition: service_completed_successfully
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_MANAGED_DIR: /etc/hermes
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      GATEWAY_MULTIPLEX_PROFILES: "true"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
      API_SERVER_CORS_ORIGINS: ${APP_PUBLIC_URL:-http://localhost}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-http://dashboard.localhost}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?Set dashboard username in .env}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?Set dashboard password in .env}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?Set dashboard session secret in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      # Hermes may inspect the same Markdown that Obsidian syncs, but this
      # mount is read-only. All agent writes go through the revision-checked
      # knowledge API below.
      OBSIDIAN_VAULT_PATH: /vault
      OBSIDIAN_VAULT_NAME: ${OBSIDIAN_VAULT_NAME:-HERMESS}
      KNOWLEDGE_API_URL: http://knowledge:8000
      KNOWLEDGE_API_KEY: ${KNOWLEDGE_API_KEY:?Set KNOWLEDGE_API_KEY in .env}
    volumes:
      - ${HERMES_DATA_DIR:-./data/hermes}:/opt/data
      # Official managed scope is deep-merged after every root/named profile
      # config, including on dashboard-triggered gateway hot restarts.
      - ./config/hermes-managed:/etc/hermes:ro
      - ${KNOWLEDGE_DATA_DIR:-./data/knowledge}/notes:/vault:ro
    expose:
      - "8642"
      - "9119"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null && curl -sS -o /dev/null http://127.0.0.1:9119/"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  knowledge-init:
    image: ${ALPINE_IMAGE:-alpine:3.22}
    restart: "no"
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    environment:
      # The read-only index shares Hermes' owner UID so it can read private
      # MEMORY.md files without making them world-readable.
      KNOWLEDGE_UID: ${HERMES_UID:-10000}
      KNOWLEDGE_GID: ${HERMES_GID:-10000}
    volumes:
      - ${KNOWLEDGE_DATA_DIR:-./data/knowledge}:/data
      - ./knowledge/notes:/bootstrap-notes:ro
      - ./deploy/scripts/bootstrap-knowledge.sh:/usr/local/bin/bootstrap-knowledge:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/bootstrap-knowledge"]

  extractor:
    # Untrusted document parsers run in a separate, disposable trust domain.
    # This service has no API keys and cannot see either the vault or state PVC.
    image: ${EXTRACTOR_IMAGE:-hermess-extractor:local}
    build:
      context: ./knowledge
      dockerfile: Dockerfile
      target: extractor
    restart: unless-stopped
    init: true
    user: "10001:10001"
    command:
      - uvicorn
      - app.extractor_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
      - --workers
      - "1"
      - --no-access-log
    environment:
      # Keep every transient parser byte on the bounded in-memory mount below.
      TMPDIR: /tmp
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    networks:
      - extraction

  knowledge:
    image: ${KNOWLEDGE_IMAGE:-hermess-knowledge:local}
    build:
      context: ./knowledge
      dockerfile: Dockerfile
      target: knowledge
    restart: unless-stopped
    user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
    depends_on:
      knowledge-init:
        condition: service_completed_successfully
      extractor:
        condition: service_healthy
    environment:
      KNOWLEDGE_API_KEY: ${KNOWLEDGE_API_KEY:?Set KNOWLEDGE_API_KEY in .env}
      KNOWLEDGE_ROOT: /data/notes
      KNOWLEDGE_STATE_DIR: /data/state
      KNOWLEDGE_EXTRACTOR_URL: http://extractor:8010
      # Starlette spools larger multipart parts before the endpoint runs. Keep
      # that private temporary data on the writable knowledge volume.
      TMPDIR: /data/state/import-spool
      KNOWLEDGE_VAULT_NAME: ${OBSIDIAN_VAULT_NAME:-HERMESS}
      KNOWLEDGE_CORS_ORIGINS: ${APP_PUBLIC_URL:-http://localhost}
      KNOWLEDGE_EMBEDDING_BACKEND: ${KNOWLEDGE_EMBEDDING_BACKEND:-auto}
      KNOWLEDGE_MODEL_NAME: ${KNOWLEDGE_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      KNOWLEDGE_MODEL_REVISION: ${KNOWLEDGE_MODEL_REVISION:-1110a243fdf4706b3f48f1d95db1a4f5529b4d41}
      KNOWLEDGE_AUTO_INDEX: ${KNOWLEDGE_AUTO_INDEX:-true}
      KNOWLEDGE_SCAN_INTERVAL_SECONDS: ${KNOWLEDGE_SCAN_INTERVAL_SECONDS:-60}
      KNOWLEDGE_IMPORT_MAX_FILES: ${KNOWLEDGE_IMPORT_MAX_FILES:-12}
      KNOWLEDGE_IMPORT_MAX_FILE_BYTES: ${KNOWLEDGE_IMPORT_MAX_FILE_BYTES:-16777216}
      KNOWLEDGE_IMPORT_MAX_TOTAL_BYTES: ${KNOWLEDGE_IMPORT_MAX_TOTAL_BYTES:-67108864}
      KNOWLEDGE_IMPORT_MAX_EXTRACTED_BYTES: ${KNOWLEDGE_IMPORT_MAX_EXTRACTED_BYTES:-1800000}
      KNOWLEDGE_IMPORT_PARSER_TIMEOUT_SECONDS: ${KNOWLEDGE_IMPORT_PARSER_TIMEOUT_SECONDS:-30}
      KNOWLEDGE_IMPORT_BATCH_DEADLINE_SECONDS: ${KNOWLEDGE_IMPORT_BATCH_DEADLINE_SECONDS:-90}
      KNOWLEDGE_IMPORT_ORIGINAL_QUOTA_BYTES: ${KNOWLEDGE_IMPORT_ORIGINAL_QUOTA_BYTES:-4294967296}
      KNOWLEDGE_IMPORT_FREE_SPACE_RESERVE_BYTES: ${KNOWLEDGE_IMPORT_FREE_SPACE_RESERVE_BYTES:-1073741824}
      # Scan the root Hermes home plus every named profile, but only import
      # each home's skills and memory Markdown allowlist.
      KNOWLEDGE_HERMES_HOMES: /hermes,/hermes/profiles/*
    volumes:
      - ${KNOWLEDGE_DATA_DIR:-./data/knowledge}:/data
      - ${HERMES_DATA_DIR:-./data/hermes}:/hermes:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    networks:
      - backend
      - extraction

  frontend:
    image: ${FRONTEND_IMAGE:-hermess-frontend:local}
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_healthy
      knowledge:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      HERMES_DASHBOARD_INTERNAL_URL: http://hermes:9119
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?Set dashboard username in .env}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?Set dashboard password in .env}
      # Server-only access for the bounded multipart import BFF. The browser
      # never receives the sidecar key and uploads remain same-origin.
      KNOWLEDGE_API_URL: http://knowledge:8000
      KNOWLEDGE_API_KEY: ${KNOWLEDGE_API_KEY:?Set KNOWLEDGE_API_KEY in .env}
      # Solari is fail-closed by default. The long-lived project key is mounted
      # as a 0440 server-only secret; browsers receive only the SDP answer.
      SOLARI_REALTIME_ENABLED: ${SOLARI_REALTIME_ENABLED:-false}
      SOLARI_REALTIME_MODEL: ${SOLARI_REALTIME_MODEL:-gpt-realtime-2.1}
      OPENAI_REALTIME_API_KEY_FILE: /run/secrets/openai_realtime_api_key
    secrets:
      - source: openai_realtime_api_key
        target: openai_realtime_api_key
        uid: "1000"
        gid: "1000"
        mode: 0440
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648}
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_healthy
      knowledge:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-http://localhost}
      CADDY_DEFAULT_SNI: ${CADDY_DEFAULT_SNI:-localhost}
      DASHBOARD_ADDRESS: ${DASHBOARD_ADDRESS:-http://dashboard.localhost}
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER:?Set Caddy username in .env}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH:?Set a Caddy password hash in .env}
      HERMES_API_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
      KNOWLEDGE_API_KEY: ${KNOWLEDGE_API_KEY:?Set KNOWLEDGE_API_KEY in .env}
    ports:
      - ${HTTP_PORT:-80}:8080
      - ${HTTPS_PORT:-443}:8443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Caddy's admin API supports GET but intentionally rejects HEAD.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The official Caddy binary carries this file capability. Keeping it in
      # the bounding set is required even though we bind high container ports.
      - NET_BIND_SERVICE
    networks:
      - backend

networks:
  backend:
    driver: bridge
  # Only the writer and the secretless parser can join this network. Marking it
  # internal prevents the parser from reaching the host uplink or public network.
  extraction:
    driver: bridge
    internal: true

volumes:
  caddy-data:
  caddy-config:

secrets:
  # Compose reads this value from the operator environment/.env and materializes
  # it as a file; it is never injected into the frontend process environment.
  openai_realtime_api_key:
    environment: OPENAI_REALTIME_API_KEY
